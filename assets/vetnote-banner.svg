<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">VetNote — Built for veterinary work in the field</title>
  <desc id="desc">A restrained dark green banner with the VetNote name, an in-development label and an abstract field route.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1817"/>
      <stop offset="1" stop-color="#162923"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD1A5"/>
      <stop offset="1" stop-color="#C5F0DB"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="110" r="210" fill="#4FA47D" opacity="0.11" filter="url(#glow)"/>
  <text x="74" y="83" fill="#7EC5A5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="5">FIELD COMPANION</text>
  <text x="70" y="208" fill="#F3F8F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="94" font-weight="760" letter-spacing="-5">VetNote</text>
  <text x="74" y="266" fill="#C4D1CB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">Clear notes. Real terrain. Offline first.</text>
  <rect x="74" y="307" width="208" height="38" rx="19" fill="#DDF5E9"/>
  <text x="178" y="332" text-anchor="middle" fill="#206949" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1.7">IN DEVELOPMENT</text>
  <g opacity="0.92">
    <path d="M770 293C825 286 830 207 889 201C950 194 949 116 1020 111C1075 107 1092 153 1128 164" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 15"/>
    <circle cx="770" cy="293" r="21" fill="#0F1B18" stroke="#79D4AB" stroke-width="6"/>
    <circle cx="889" cy="201" r="18" fill="#0F1B18" stroke="#9FE2C3" stroke-width="6"/>
    <circle cx="1020" cy="111" r="21" fill="#0F1B18" stroke="#C5F0DB" stroke-width="6"/>
    <g transform="translate(973 82)">
      <rect x="35" y="0" width="24" height="80" rx="8" fill="#E7F6EE"/>
      <rect x="7" y="28" width="80" height="24" rx="8" fill="#E7F6EE"/>
    </g>
  </g>
</svg>
